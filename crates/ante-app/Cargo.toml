[package]
name = "ante-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ante"
path = "src/main.rs"

[features]
dev-tools = ["dep:tracing", "dep:tracing-subscriber"]
extra-jokers = ["ante-core/extra-jokers"]

[dependencies]
ante-core = { path = "../ante-core" }
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui", "system_clipboard", "audio"] }
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }
rand = "0.8"
serde_json = "1"
skrifa = "0.44.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
