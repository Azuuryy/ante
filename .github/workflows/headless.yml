name: Headless core

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - name: Reject Bevy in the core dependency graph
        shell: bash
        run: |
          tree=$(cargo tree --locked -p ante-core --prefix none)
          if printf '%s\n' "$tree" | grep -i '^bevy'; then exit 1; fi
      - run: cargo test --locked -p ante-core -p ante-cli
