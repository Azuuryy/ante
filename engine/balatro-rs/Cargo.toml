[package]
name = "balatro-rs"
version = "0.0.1"
edition = "2021"
description = "Vendored and patched balatro-rs rules engine used by Ante"
license = "MIT"
publish = false

[dependencies]
rand = "~0.8.5"
rand_chacha = "0.3"
thiserror = "~1.0.61"
serde = { version = "~1.0.215", optional = true, features = ["derive"] }
serde_json = { version = "~1.0.118", optional = true }
tracing = { version = "~0.1.40", optional = true }
uuid = { version = "1", optional = true, features = ["v7"] }
itertools = "0.13.0"
indexmap = "2.6.0"
strum = { version = "0.26", features = ["derive"] }
balatro-types = { path = "../balatro-types" }
balatro-seed = { path = "../balatro-seed" }

[features]
default = ["serde"]
ante-extra-jokers = []
serde = ["dep:serde", "dep:serde_json", "uuid?/serde", "rand_chacha/serde1", "balatro-types/serde", "balatro-seed/serde"]
